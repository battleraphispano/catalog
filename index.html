<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Battle Rap Hispano | Rap Battle Database</title>
  <style>
    :root {
      --primary-yellow: #ffff00;
      --bg-dark: #0a0a0a;
      --card-dark: #121212;
      --card-hover: #1a1a1a;
      --text-light: #ffffff;
      --text-muted: #888888;
      --border-color: #222222;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Programme', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      line-height: 1.5;
    }

    /* Header / Hero Section */
    .hero-banner {
      background: linear-gradient(180deg, #181818 0%, var(--bg-dark) 100%);
      border-bottom: 2px solid var(--primary-yellow);
      padding: 3.5rem 1.5rem 1.5rem 1.5rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header-content {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .cover-art {
      width: 140px;
      height: 140px;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(255, 255, 0, 0.12);
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .cover-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .meta-info h1 {
      font-size: 2.4rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      margin-bottom: 0.8rem;
      line-height: 1.1;
    }

    .meta-info h1 span {
      color: var(--primary-yellow);
    }

    .header-bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      gap: 1rem;
    }

    .author-tag {
      font-size: 0.8rem;
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .header-widgets {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .stats-bar {
      display: flex;
      gap: 1.5rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      padding: 0.6rem 1rem;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .stats-bar strong {
      color: var(--text-light);
    }

    .alphabet-nav-top {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      background: rgba(255, 255, 255, 0.03);
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    /* Main Layout */
    .main-layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 2.5rem;
      padding: 2.5rem 1.5rem 4rem 1.5rem;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 800;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.6rem;
      margin-bottom: 1.5rem;
      letter-spacing: 1px;
    }

    /* Letter Group Dividers */
    .letter-group-container {
      margin-bottom: 2rem;
    }

    .letter-group-title {
      color: var(--primary-yellow);
      font-size: 1.4rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 1rem;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 0.3rem;
    }

    /* Grid de Tarjetas con el tamaño original restaurado */
    .fighters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 1.25rem;
    }

    .fighter-card {
      background-color: var(--card-dark);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
    }

    .fighter-card:hover {
      border-color: var(--primary-yellow);
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .fighter-img-container {
      width: 100%;
      height: 220px;
      background-color: #1a1a1a;
      overflow: hidden;
      position: relative;
    }

    .fighter-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .fighter-card:hover .fighter-img-container img {
      transform: scale(1.05);
    }

    .fighter-info {
      padding: 1.1rem 1rem;
      background-color: var(--card-dark);
      border-top: 1px solid var(--border-color);
    }

    .fighter-name {
      font-weight: 800;
      font-size: 1rem;
      text-transform: uppercase;
      color: var(--text-light);
      letter-spacing: 0.5px;
      display: block;
    }

    .fighter-card:hover .fighter-name {
      color: var(--primary-yellow);
    }

    /* Sidebar / Navigation */
    aside {
      position: sticky;
      top: 2rem;
      height: fit-content;
    }

    .letter-btn {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 3px;
      background: #1a1a1a;
      color: #555;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .letter-btn.active {
      background: var(--primary-yellow);
      color: var(--bg-dark);
    }

    .letter-btn.disabled {
      opacity: 0.2;
      pointer-events: none;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
      aside {
        position: static;
      }
      .header-content {
        flex-direction: column;
        text-align: center;
      }
      .header-bottom-bar {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <!-- Header Banner -->
  <header class="hero-banner">
    <div class="container">
      <div class="header-content">
        <div class="cover-art">
          <img src="battleraphispano.jfif" alt="Battle Rap Hispano">
        </div>
        <div class="meta-info">
          <h1>Catálogo de <span>Battle Rap Hispano</span></h1>
          <div class="header-bottom-bar">
            <div class="header-widgets">
              <div class="stats-bar">
                <span><strong>28</strong> Perfiles</span>
                <span><strong>A - Z</strong> Alfabético</span>
              </div>
              <div class="alphabet-nav-top">
